<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout('Thông Tin Sách', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card card-custom">
                <div class="card-header bg-white py-3 border-bottom">
                    <h5 class="fw-bold mb-0" th:text="${book.id == null ? 'Thêm Sách Mới' : 'Cập Nhật Thông Tin Sách'}">Quản Lý Sách</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/books}" th:object="${book}" method="post" class="row g-3">
                        <input type="hidden" th:field="*{id}"/>
                        <input type="hidden" th:field="*{availableQuantity}"/>
                        <input type="hidden" th:field="*{version}"/>

                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Tên Sách <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{title}" class="form-control" th:errorclass="is-invalid" placeholder="Nhập tên sách...">
                            <div class="invalid-feedback" th:errors="*{title}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Tác Giả <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{author}" class="form-control" th:errorclass="is-invalid" placeholder="Nhập tên tác giả...">
                            <div class="invalid-feedback" th:errors="*{author}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Mã ISBN <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{isbn}" class="form-control" th:errorclass="is-invalid" placeholder="Ví dụ: 978-0132350884">
                            <div class="invalid-feedback" th:errors="*{isbn}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Thể Loại <span class="text-danger">*</span></label>
                            <select th:field="*{category.id}" class="form-select" th:errorclass="is-invalid">
                                <option value="">-- Chọn thể loại --</option>
                                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{category}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Trạng Thái</label>
                            <select th:field="*{status}" class="form-select">
                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Tổng Số Lượng <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{totalQuantity}" class="form-control" min="1" placeholder="Số lượng...">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Giá Thuê/Ngày (VNĐ)</label>
                            <input type="number" th:field="*{pricePerDay}" class="form-control" min="0" step="500">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Tiền Đặt Cọc (VNĐ)</label>
                            <input type="number" th:field="*{depositPrice}" class="form-control" min="0" step="1000">
                        </div>

                        <div class="col-12 mt-4 d-flex justify-content-end gap-2 border-top pt-3">
                            <a href="/books" class="btn btn-outline-secondary px-4">Hủy Bỏ</a>
                            <button type="submit" class="btn btn-primary btn-primary-custom px-4"><i class="bi bi-save me-1"></i> Lưu Thông Tin</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
