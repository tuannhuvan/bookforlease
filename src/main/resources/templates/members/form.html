<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout('Thông Tin Độc Giả', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-custom">
                <div class="card-header bg-white py-3 border-bottom">
                    <h5 class="fw-bold mb-0" th:text="${member.id == null ? 'Thêm Độc Giả Mới' : 'Cập Nhật Độc Giả'}">Thông Tin Độc Giả</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/members}" th:object="${member}" method="post" class="row g-3">
                        <input type="hidden" th:field="*{id}"/>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Họ và Tên <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{fullName}" class="form-control" th:errorclass="is-invalid" placeholder="Nhập họ và tên...">
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                            <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" placeholder="example@domain.com">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Số Điện Thoại <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{phone}" class="form-control" th:errorclass="is-invalid" placeholder="09xxxxxxx">
                            <div class="invalid-feedback" th:errors="*{phone}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Trạng Thái</label>
                            <select th:field="*{status}" class="form-select">
                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                            </select>
                        </div>

                        <div class="col-12 mt-4 d-flex justify-content-end gap-2 border-top pt-3">
                            <a href="/members" class="btn btn-outline-secondary px-4">Hủy Bỏ</a>
                            <button type="submit" class="btn btn-primary btn-primary-custom px-4"><i class="bi bi-save me-1"></i> Lưu Độc Giả</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
